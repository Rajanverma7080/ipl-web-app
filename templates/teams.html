<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>IPL Teams</title>

    <!-- Teams page CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


    <!-- ================= HEADER ================= -->

    <header class="header">

        <div class="logo">

            <img
                src="{{ url_for('static', filename='images/ipl_logo.png') }}"
                alt="IPL Logo"
            >

        </div>

    </header>



    <!-- ================= BREADCRUMB ================= -->

    <div class="breadcrumb">

        <a href="/">
            Home
        </a>

        <span>›</span>

        <span>
            IPL Teams
        </span>

    </div>



    <!-- ================= MAIN CONTENT ================= -->

    <main class="container">


        <!-- ================= PAGE HEADING ================= -->

        <section class="page-heading">

            <h1>
                IPL TEAMS
            </h1>

            <p>
                Here are all the teams that compete in the
                Indian Premier League.
            </p>

        </section>



        <!-- ================= TEAM SUMMARY ================= -->

        <section class="summary">


            <!-- LEFT SIDE -->

            <div class="summary-left">

                <div class="summary-icon">
                    👥
                </div>

                <div>

                    <p>
                        Total Teams
                    </p>

                    <h2>
                        {{ teams|length }}
                    </h2>

                </div>

            </div>



            <!-- RIGHT SIDE -->

            <div class="info-box">

                <span class="info-icon">
                    ℹ️
                </span>

                <span>
                    Click on any team to view more details
                    and records.
                </span>

            </div>


        </section>



        <!-- ================= TEAMS GRID ================= -->

        <section class="teams-grid">


            <!-- LOOP THROUGH ALL TEAMS -->

            {% for team in teams %}


            <!-- ================= SINGLE TEAM CARD ================= -->

            <div class="team-card">


                <!-- TEAM LOGO -->

                <div class="team-logo-container">

                    <img
                        src="{{ url_for('static', filename='images/' + team.logo) }}"
                        alt="{{ team.name }}"
                        class="team-logo"
                    >

                </div>



                <!-- SHORT TEAM NAME -->

                <h2>
                    {{ team.short_name }}
                </h2>



                <!-- FULL TEAM NAME -->

                <p>
                    {{ team.name }}
                </p>



                <!-- VIEW DETAILS BUTTON -->

                <a
                    href="#"
                    class="view-button"
                >
                    View Details
                </a>


            </div>


            <!-- END TEAM CARD -->

            {% endfor %}


        </section>


    </main>


</body>

</html>
